    /* ... keeping your existing styles ... */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f0; min-height: 100vh; }
    .header { background: #1a5c1a; color: white; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .header-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; }
    .pv-badge { margin-left: auto; background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 600; }

    .card-header { padding: 0.875rem 1rem; border-bottom: 1px solid #f0f0ee; display: flex; align-items: center; gap: 8px; }
    .card-header h2 { font-size: 14px; font-weight: 600; color: #1a5c1a; }
    .step-num { width: 22px; height: 22px; background: #1a5c1a; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .card-body { padding: 1rem; }
    .upload-zone { border: 2px dashed #c8d8c8; border-radius: 10px; padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; background: #f8fdf8; }
    .upload-zone:hover { border-color: #1a5c1a; background: #f0f8f0; }
    .upload-zone input { display: none; }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    #preview-container { text-align: center; margin-top: 0.75rem; display: none; }
    #preview-img { max-width: 100%; max-height: 180px; border-radius: 8px; display: none; object-fit: contain; margin: 0 auto; }
    #preview-pdf { display: none; background: #f4f4f2; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; color: #c62828; font-weight: 600; font-size: 14px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-wrap { display: flex; flex-direction: column; gap: 4px; }
    .field-wrap.full { grid-column: 1 / -1; }
    .field-wrap label { font-size: 12px; color: #666; font-weight: 500; }
